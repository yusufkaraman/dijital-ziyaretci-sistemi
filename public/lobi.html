<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dijital Ziyaretci — Lobi Ekrani</title>
  <meta name="description" content="Dijital Ziyaretci Karsilama Lobi Ekrani" />
  <link rel="icon" type="image/png" href="/Assets/sitelogo.png" />
  <link rel="stylesheet" href="/fonts/noto-sans.css" />
  <link rel="stylesheet" href="/lobi.css" />
</head>

<body>

  <!-- ARKA PLAN PARTİKÜLLER -->
  <div class="lb-particles" id="lb-particles"></div>

  <!-- ANA KABUK -->
  <div class="lb-shell" id="lb-shell">

    <!-- ════════ SOL BÖLGE ════════ -->
    <section class="lb-left" id="lb-left">

      <!-- Logo Bandı -->
      <div class="lb-logo-bar">
        <div class="lb-logo-wrap">
          <!-- Beyaz kutucuk içinde favicon/logo -->
          <div class="lb-logo-box">
            <img src="/Assets/sitelogo.png" alt="Logo" class="lb-logo-img" id="lb-logo-img" />
          </div>
          <div class="lb-brand-texts">
            <span class="lb-brand-name" id="lb-brand-name"></span>
            <span class="lb-brand-sub">Dijital Ziyaretçi Sistemi</span>
          </div>
        </div>
        <div class="lb-conn-status">
          <div class="lb-conn-dot" id="lb-conn-dot"></div>
        </div>
      </div>

      <!-- Video / Görsel Oynatıcı -->
      <div class="lb-video-wrap" id="lb-video-wrap">
        <div class="lb-video-player" id="lb-video-player">
          <div class="lb-video-placeholder" id="lb-video-placeholder">
            <div class="lb-placeholder-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
            </div>
            <div class="lb-placeholder-text">İçerik Yükleniyor...</div>
          </div>
        </div>

        <!-- Video üstü hoşgeldiniz bandı -->
        <div class="lb-welcome-bar">
          <div class="lb-welcome-bar-title" id="lb-welcome-bar-title"></div>
          <div class="lb-welcome-bar-sub" id="lb-welcome-bar-sub"></div>
        </div>
      </div>

      <!-- ZİYARETÇİ KARŞILAMA OVERLAY -->
      <div class="lb-visitor-overlay screen-hide" id="lb-visitor-overlay">
        <div class="lb-visitor-card" id="lb-visitor-card">
          <div class="lb-visitor-deco"></div>
          <!-- Sirket logosu — card üstünde belirgin -->
          <div class="lb-visitor-logo-wrap" id="lb-visitor-logo-wrap" style="display:none">
            <img id="lb-visitor-card-logo" src="" alt="" class="lb-visitor-card-logo" />
          </div>
          <div class="lb-visitor-hosgeldiniz">HOŞGELDİNİZ</div>
          <div class="lb-visitor-name" id="lb-visitor-name">—</div>
          <div class="lb-visitor-company" id="lb-visitor-company"></div>
          <div class="lb-visitor-divider"></div>
          <div class="lb-visitor-info-row">
            <div class="lb-visitor-info-item">
              <span class="lb-visitor-info-lbl">Görüşeceğiniz Kişi</span>
              <span class="lb-visitor-info-val" id="lb-visitor-host">—</span>
            </div>
            <div class="lb-visitor-info-item">
              <span class="lb-visitor-info-lbl">Departman / Şirket</span>
              <div class="lb-visitor-host-company-row">
                <img id="lb-visitor-host-logo" src="" alt="" class="lb-visitor-host-logo" style="display:none" />
                <span class="lb-visitor-info-val" id="lb-visitor-host-company">—</span>
              </div>
            </div>
          </div>
          <div class="lb-visitor-media-wrap" id="lb-visitor-media-wrap" style="display:none">
            <img id="lb-visitor-card-media" src="" alt="" class="lb-visitor-card-media" />
          </div>
          <div class="lb-visitor-invite-badge">
            İçeri Davet Edildiniz
          </div>
        </div>
      </div>

    </section>

    <!-- ════════ SAĞ PANEL ════════ -->
    <aside class="lb-right-panel" id="lb-right-panel">

      <!-- Sadece Saat -->
      <div class="lb-clock-section">
        <div class="lb-clock-time" id="lb-clock-time">00:00</div>
        <div class="lb-clock-date" id="lb-clock-date">—</div>
        <div class="lb-clock-day"  id="lb-clock-day">—</div>
      </div>

      <div class="lb-panel-divider"></div>

      <!-- Hava Durumu (başlıksız) -->
      <div class="lb-weather-section" id="lb-weather-section">
        <div class="lb-weather-city" id="lb-weather-city">Ankara</div>
        <div class="lb-weather-row">
          <div class="lb-weather-temp" id="lb-weather-temp">—</div>
          <div class="lb-weather-icon" id="lb-weather-icon">
            <!-- SVG ikonu JS tarafından atanır -->
          </div>
        </div>
        <div class="lb-weather-cond"  id="lb-weather-cond">Yükleniyor...</div>
        <div class="lb-weather-extra" id="lb-weather-extra"></div>
        <div class="lb-weather-forecast" id="lb-weather-forecast"></div>
      </div>

      <div class="lb-panel-divider"></div>

      <!-- Güncel Haberler -->
      <div class="lb-news-section">
        <div class="lb-news-heading">GÜNCEL HABERLER</div>
        <div class="lb-news-list" id="lb-news-list">
          <!-- JS tarafından doldurulur -->
        </div>
      </div>

    </aside>

  </div><!-- /lb-shell -->

  <!-- ALT KAYAN BANT -->
  <footer class="lb-ticker-bar">
    <div class="lb-ticker-brand">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.58 3.47A2 2 0 0 1 3.56 1.34h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.88a16 16 0 0 0 6.06 6.06l.88-.88a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.56 16.56Z"/></svg>
      <span id="lb-ticker-brand-text">+90 532 743 69 62</span>
    </div>
    <div class="lb-ticker-track">
      <div class="lb-ticker-inner" id="lb-ticker-inner"></div>
    </div>
    <div class="lb-ticker-date" id="lb-ticker-date"></div>
  </footer>

  <!-- Tam Ekran Butonu (sağ alt) -->
  <button class="lb-fs-btn" id="lb-fs-btn" onclick="lobiToggleFullscreen()" title="Tam Ekran">
    <svg id="lb-fs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
  </button>
  <button class="lb-logout-btn" onclick="logout()" title="Çıkış Yap">Çıkış</button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/api.js"></script>
  <script src="/js/core/formatters.js"></script>
  <script src="/js/core/socket.js"></script>
  <script src="/js/panels/lobby-screen.js"></script>
</body>
</html>

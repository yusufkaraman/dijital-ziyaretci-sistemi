<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIKMAZ GRUP — Giris</title>
  <meta name="description" content="Dijital Misafir Karşılama Sistemi Giriş Ekranı" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/fonts/noto-sans.css" />
  
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
<div class="particles" id="particles"></div>

<div class="login-card">
  <div class="logo-wrap">
    <div class="logo-icon">
      <img src="/Assets/sitelogo.png" alt="BIKMAZ GRUP Logo" style="width:100%; height:100%; object-fit:contain;" />
    </div>
    <span class="logo-title">BIKMAZ GRUP</span>
    <span class="logo-sub">Dijital Misafir Karşılama Sistemi</span>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <form id="login-form" onsubmit="doLogin(event)">
    <div class="form-group">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" placeholder="kullanici_adi" autocomplete="username" required />
    </div>
    <div class="form-group">
      <label for="password">Şifre</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn-login" id="login-btn">Giriş Yap</button>
  </form>

  <div class="hint-box">
    <p>Demo Hesaplar</p>
    <code>admin    / admin123</code>
    <code>sekreter / sekreter123</code>
    <code>mudur    / mudur123</code>
    <code>personel / personel123</code>
  </div>

  <div class="quick-links">
    <a class="quick-link" onclick="quickLogin('sekreter','sekreter123')">📋 Sekreter Girişi</a>
    <a class="quick-link" onclick="quickLogin('mudur','mudur123')">👔 Yönetici Girişi</a>
    <a class="quick-link" onclick="quickLogin('personel','personel123')">👤 Personel Girişi</a>
    <a class="quick-link" href="/lobi" target="_blank">📺 Lobi Ekranı</a>
    <a class="quick-link" onclick="quickLogin('admin','admin123')">⚙️ Admin Girişi</a>
  </div>
</div>

<script src="/js/core/api.js"></script>
<script src="/js/core/auth.js"></script>
<script src="/js/core/permissions.js"></script>
<script src="/js/core/ui.js"></script>
<script src="/js/core/socket.js"></script>
<script src="/js/core/notifications.js"></script>
<script src="/js/core/branding.js"></script>
<script src="/js/core/formatters.js"></script>
<script src="/js/core/charts.js"></script>
<script src="/js/core/password.js"></script>
<script src="/js/panels/login-page.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  if (typeof io !== 'undefined') {
    const socket = io();
    socket.on('system:reload', () => {
      console.log('🔄 Update detected, reloading...');
      location.reload();
    });
  }
</script>
</body>
</html>
